# Same as cg_ball_touch04 (contest geometry, ball-touch lag 0.4, decode.wide wide2 grid, 3+7 epochs, baseline
# initialization), with three additional public Metrica matches (pipeline/external/metrica.py; convert the ball
# to the original DFL convention, then degrade as DFL; analysis/metrica_data.md). Only training data differs: 5 ->8 matches.
# Reduce dependence on DFL-specific league properties; the target is not DFL. Auto-download at a pinned commit with SHA-256 checks.
name = "bt04_metrica"
base = "models/baseline"

[train]
seeds = [1, 2, 3]
freeze_old_inputs = true
extra_train = ["METRICA-SG1", "METRICA-SG2", "METRICA-SG3"]

[[train.stage]]
epochs = 3
lr = 1e-3
freeze = ["encoder.phi.2", "temporal", "had", "touch", "team", "ball"]

[[train.stage]]
epochs = 7
lr = 3e-4
freeze = []
freeze_old_inputs = false

[[step]]
use = "feature.contest_geometry"

[[step]]
use = "feature.ball_touch"
lag = 0.4

[[step]]
use = "decode.wide"
scale = [0.01, 0.02, 0.05]
lambda_emit = [0.3, 0.5, 1.0]
window = [0, 3, 8]
gate_scale = [0.02, 0.05, 0.1]
floor = [1e-14, 1e-12, 1e-10]
