# Final submission training: selected bt04_metrica configuration, adding dev match J03WN1 to training.
# Six DFL +three Metrica matches. No further dev selection or early stopping; keep epochs 8,9,10 per seed.
# bt04_metrica retained 8/9/10, 7/8/10, 8/9/10 by dev score; copy decoder settings from models/bt04_metrica.
# Printed dev scores are contaminated because dev is in training. Reserved J03WR9 is for one final evaluation only.
name = "final_metrica"
base = "models/baseline"

[train]
seeds = [1, 2, 3]
freeze_old_inputs = true
extra_train = ["METRICA-SG1", "METRICA-SG2", "METRICA-SG3"]
final = true
decode_from = "models/bt04_metrica"

[[train.stage]]
epochs = 3
lr = 1e-3
freeze = ["encoder.phi.2", "temporal", "had", "touch", "team", "ball"]

[[train.stage]]
epochs = 7
lr = 3e-4
freeze = []
freeze_old_inputs = false

[[step]]
use = "feature.contest_geometry"

[[step]]
use = "feature.ball_touch"
lag = 0.4

[[step]]
use = "decode.wide"
scale = [0.01, 0.02, 0.05]
lambda_emit = [0.3, 0.5, 1.0]
window = [0, 3, 8]
gate_scale = [0.02, 0.05, 0.1]
floor = [1e-14, 1e-12, 1e-10]
